# 统一参数；命令从仓库根目录执行。复制本文件并传 --config 可建立新方案。
# model/train 用于下次训练；已有checkpoint的结构和图像尺寸以checkpoint为准。
# 随机集冻结后修改count/seed须使用新path，禁止覆盖旧集。
random_set:
  # 同一固定模型，原生reset采样方块xy/yaw和机器人初始化噪声
  path: data/lift_act/random_dev100_v1.hdf5
  count: 100
  seed: 20261103
eval:
  initial_states: random  # random 或 valid（历史20个示范初态）
  policy: act  # act 或 act_hold
  steps: 100
  execution_horizon: 5  # H，不能超过checkpoint预测长度K
  control_freq: 20  # PH动作仅验证20Hz，当前禁止直接修改
  hold_trigger_height: 0.04  # 方块中心相对桌面，米；只改变规则触发
  hold_trigger_steps: 10
  metric_confirmation_steps: 10
  metric_hold_seconds: 2.0
  hold_position_gain: 1.0
  hold_rotation_gain: 1.0
  checkpoint: outputs/act_lift20_candidate/checkpoint.pt
model:
  chunk_size: 20
  hidden_dim: 256
  dim_feedforward: 1024
  enc_layers: 4
  dec_layers: 4
  nheads: 8
  backbone: resnet18
  dropout: 0.1
  image_size:
  - 128
  - 128
train:
  budget: 20  # 20或50，自动配套训练统计量
  seed: 42
  updates: 2000
  batch_size: 8
  lr: 0.0001
  lr_backbone: 1.0e-05
  weight_decay: 0.0001
  kl_weight: 10.0
  gradient_clip: 1.0
  pretrained_backbone: true  # ACT_PRETRAINED环境变量可覆盖
  output: outputs/act_lift20_config_v1  # 必须是新目录
